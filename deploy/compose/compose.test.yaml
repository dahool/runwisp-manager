name: rwm-test

services:
  runwisp-data-init:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "chown ${RWM_UID:-1000}:${RWM_GID:-1000} /data"]
    volumes:
      - runwisp-data:/data

  runwisp:
    image: runwisp/runwisp:${RUNWISP_VERSION:-1.7.0}
    user: "${RWM_UID:-1000}:${RWM_GID:-1000}"
    environment:
      RUNWISP_AUTH: off
      TELEGRAM_BOT_TOKEN: test-token-not-for-production
    volumes:
      - ./testdata/config:/etc/runwisp
      - runwisp-data:/var/lib/runwisp
    depends_on:
      runwisp-data-init:
        condition: service_completed_successfully

  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG: |
        {
          "interactiveLogin": false,
          "tokenCallbacks": [{
            "issuerId": "default",
            "requestMappings": [{
              "requestParam": "code",
              "match": "*",
              "claims": {
                "sub": "test-user",
                "aud": ["rwm-test"],
                "preferred_username": "test-user",
                "name": "Test User",
                "email": "test@example.com",
                "email_verified": true,
                "groups": ["rwm-admin"]
              }
            }]
          }]
        }
    ports:
      - "8080:8080"

  oidc-ready:
    image: curlimages/curl:8.12.1
    depends_on:
      - mock-oidc
    entrypoint: ["sh", "-c"]
    command: ["until curl --fail --silent http://mock-oidc:8080/default/.well-known/openid-configuration >/dev/null; do sleep 1; done"]

  manager:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        RUNWISP_VERSION: ${RUNWISP_VERSION:-1.7.0}
        RWM_UID: ${RWM_UID:-1000}
        RWM_GID: ${RWM_GID:-1000}
    user: "${RWM_UID:-1000}:${RWM_GID:-1000}"
    depends_on:
      runwisp:
        condition: service_started
      oidc-ready:
        condition: service_completed_successfully
    ports:
      - "9478:9478"
    extra_hosts:
      - "oidc.localtest.me:host-gateway"
    environment:
      RWM_RUNWISP_URL: http://runwisp:9477
      RWM_EXTERNAL_URL: http://localhost:9478
      RWM_LANDING: manager
      RWM_STATE_DIR: /var/lib/runwisp-manager
      RWM_INSECURE_COOKIES: "true"
      RWM_OIDC_ISSUER_URL: http://oidc.localtest.me:8080/default
      RWM_OIDC_CLIENT_ID: rwm-test
      RWM_OIDC_CLIENT_SECRET: test-secret
      RWM_SESSION_SECRET: 0123456789abcdef0123456789abcdef
      # The mock issuer derives aud from non-OIDC scopes; include the client ID
      # so the manager's normal audience validation accepts its ID token.
      RWM_OIDC_SCOPES: openid profile email groups rwm-test
      RWM_OIDC_ROLE_ADMIN_GROUPS: rwm-admin
      RWM_OIDC_ROLE_EDITOR_GROUPS: rwm-editor
      RWM_OIDC_ROLE_OPERATOR_GROUPS: rwm-operator
      RWM_OIDC_ROLE_VIEWER_GROUPS: rwm-viewer
      RWM_VALIDATE_ENV_FILE: /run/test.env
      RWM_GIT_ENABLED: "true"
    volumes:
      - ./testdata/config:/etc/runwisp
      - runwisp-data:/var/lib/runwisp
      - ./testdata/test.env:/run/test.env:ro
      - manager-state:/var/lib/runwisp-manager
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128

volumes:
  runwisp-data: {}
  manager-state: {}
